[package]
name = "swe-factory"
version = "0.96.1"
description = "SWE Factory"
authors = ["SWE Factory"]
edition = "2021"
rust-version = "1.94"

# The library target is what the Tauri desktop entrypoint links against.
[lib]
name = "swe_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
regex = "1"
base64 = "0.22"
similar = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "macros", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
agent-client-protocol = "=2.1.0"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "limit"] }
rand = "0.9"
subtle = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
urlencoding = "2"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target."cfg(windows)".dependencies]
winapi = { version = "0.3.9", features = ["jobapi2", "winnt", "handleapi", "processthreadsapi", "synchapi", "tlhelp32", "winbase", "winerror", "winuser"] }
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
# Smaller, faster-to-ship release binaries.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
